
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя траектория</title>
<style>
:root {
  --bg: #10130f;
  --panel: #191e18;
  --line: #303a2c;
  --text: #f0f4eb;
  --muted: #a5b09e;
  --lime: #c9f36a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, sans-serif;
}
main { max-width: 900px; margin: auto; padding: 20px; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
}
h1, h2, h3 { line-height: 1.2; }
h1 { color: var(--lime); }
button, input, textarea {
  font: inherit;
  border-radius: 10px;
  padding: 11px;
}
button {
  background: var(--lime);
  color: #17200d;
  border: 0;
  font-weight: 700;
  cursor: pointer;
  margin: 4px;
}
input, textarea {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  margin: 5px 0 12px;
}
textarea { min-height: 100px; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
nav button { flex: 1; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.lesson {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 15px;
  margin: 10px 0;
}
pre {
  overflow: auto;
  white-space: pre-wrap;
  background: var(--bg);
  padding: 12px;
  border-radius: 10px;
}
</style>
</head>
<body>
<main>
  <section class="card" id="login">
    <h1>Моя траектория</h1>
    <p class="muted">Вход в учебную платформу</p>

    <label>Тип кабинета</label>
    <select id="role">
      <option value="student">Ученик</option>
      <option value="teacher">Учитель</option>
    </select>

    <label>Логин</label>
    <input id="username" value="student">

    <label>Пароль</label>
    <input id="password" type="password" value="1234">

    <button onclick="login()">Войти</button>
    <p id="error" class="muted"></p>
    <p class="muted">
      Демо: student / 1234 или teacher / 1234.
      Не используй реальные пароли.
    </p>
  </section>

  <section id="app" class="hidden">
    <header class="card">
      <h1>Моя траектория</h1>
      <p id="welcome"></p>
      <button onclick="logout()">Выйти</button>
    </header>

    <nav id="studentNav">
      <button onclick="showTrack('game')">Игровое программирование</button>
      <button onclick="showTrack('ege')">Подготовка к ЕГЭ</button>
      <button onclick="showDiagnostic()">Диагностика</button>
    </nav>

    <section id="content" class="card"></section>
  </section>
</main>

<script>
const lessons = {
  game: [
    {
      title: "1. Переменные и игровые параметры",
      theory: "Переменная хранит значение. В игре это могут быть здоровье, скорость, очки или количество монет.",
      code: 'health = 100\\nspeed = 5\\nhealth -= 20\\nprint(health)',
      task: "Измени здоровье и скорость. Добавь переменную с количеством монет."
    },
    {
      title: "2. Условия и правила игры",
      theory: "if выполняет команды, если условие истинно. else задаёт альтернативное действие.",
      code: 'has_key = True\\nif has_key:\\n    print("Дверь открыта")\\nelse:\\n    print("Найди ключ")',
      task: "Создай условие: если очков не меньше 100, игрок получает награду."
    },
    {
      title: "3. Циклы",
      theory: "Циклы повторяют команды. while работает, пока условие истинно. for перебирает последовательность.",
      code: 'coins = 0\\nwhile coins < 5:\\n    coins += 1\\nprint(coins)',
      task: "Напиши цикл, который увеличивает энергию на 3, пока она меньше 15."
    },
    {
      title: "4. Функции",
      theory: "Функция объединяет команды. Параметры передают данные, return возвращает результат.",
      code: 'def train(speed):\\n    return speed + 2\\nprint(train(4))',
      task: "Создай функцию, которая получает число монет и возвращает число после награды +10."
    }
  ],
  ege: [
    {
      title: "1. Трассировка алгоритмов",
      theory: "При трассировке записывай значения переменных после каждого шага. В range правая граница не включается.",
      code: 's = 0\\nfor i in range(1, 4):\\n    s += i\\nprint(s)',
      task: "Составь таблицу значений i и s на каждой итерации."
    },
    {
      title: "2. Остаток от деления",
      theory: "Оператор % возвращает остаток. Если n % 3 == 0, число делится на 3 без остатка.",
      code: 'count = 0\\nfor n in range(1, 11):\\n    if n % 3 == 0:\\n        count += 1\\nprint(count)',
      task: "Напиши программу, считающую числа от 1 до 100, которые делятся на 4."
    },
    {
      title: "3. Списки",
      theory: "Список хранит несколько значений. Цикл for позволяет обработать каждый элемент.",
      code: 'a = [4, 7, 2]\\ns = 0\\nfor x in a:\\n    s += x\\nprint(s)',
      task: "Найди сумму только чётных элементов списка."
    },
    {
      title: "4. Строки",
      theory: "Строка — последовательность символов. Её можно перебирать циклом и считать нужные буквы.",
      code: 'text = "информатика"\\ncount = 0\\nfor ch in text:\\n    if ch == "и":\\n        count += 1\\nprint(count)',
      task: "Напиши программу, считающую количество заданных символов."
    }
  ]
};

let currentRole = "student";
let progress = JSON.parse(
  localStorage.getItem("mt-progress") || "{}"
);
let currentTrack = "game";

function login() {
  const role = document.getElementById("role").value;
  const name = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;

  const valid =
    (role === "student" && name === "student" && pass === "1234") ||
    (role === "teacher" && name === "teacher" && pass === "1234");

  if (!valid) {
    document.getElementById("error").textContent =
      "Проверь тип кабинета, логин и пароль.";
    return;
  }

  currentRole = role;
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("welcome").textContent =
    role === "teacher" ? "Кабинет учителя" : "Кабинет ученика";

  document.getElementById("studentNav").classList.toggle(
    "hidden", role === "teacher"
  );

  if (role === "teacher") showTeacher();
  else showTrack("game");
}

function logout() {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}

function showTrack(track) {
  currentTrack = track;
  const items = lessons[track];

  document.getElementById("content").innerHTML =
    `<h2>${track === "game" ?
      "Игровое программирование" :
      "Подготовка к ЕГЭ"}</h2>` +
    items.map((lesson, i) => `
      <article class="lesson">
        <h3>${lesson.title}</h3>
        <p>${lesson.theory}</p>
        <pre>${lesson.code.replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")}</pre>
        <p><b>Задание:</b> ${lesson.task}</p>
        <textarea id="work-${track}-${i}"
          placeholder="Запиши решение..."></textarea>
        <button onclick="saveWork('${track}', ${i})">
          Сохранить работу
        </button>
        <span id="status-${track}-${i}"></span>
      </article>
    `).join("");
}

function saveWork(track, i) {
  const key = track + "-" + i;
  const value = document.getElementById(
    `work-${track}-${i}`
  ).value.trim();

  if (!value) {
    alert("Сначала напиши решение.");
    return;
  }

  progress[key] = {
    work: value,
    date: new Date().toISOString()
  };

  localStorage.setItem("mt-progress", JSON.stringify(progress));
  document.getElementById(`status-${track}-${i}`).textContent =
    " Сохранено в этом браузере";
}

function showTeacher() {
  const rows = Object.entries(progress);

  document.getElementById("content").innerHTML = `
    <h2>Кабинет учителя</h2>
    <p class="muted">
      Здесь отображаются работы, сохранённые в этом браузере.
    </p>
    <p>Сохранённых работ: ${rows.length}</p>
    <button onclick="exportCSV()">Экспорт CSV</button>
    <div id="workList"></div>
  `;

  document.getElementById("workList").innerHTML = rows.map(
    ([key, item]) => `
      <article class="lesson">
        <b>${key}</b>
        <p>${escapeText(item.work)}</p>
        <small class="muted">${item.date}</small>
      </article>
    `
  ).join("") || "<p>Работ пока нет.</p>";
}

function escapeText(value) {
  return String(value).replace(/[&<>"]/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
  })[ch]);
}

function showDiagnostic() {
  document.getElementById("content").innerHTML = `
    <h2>Входная диагностика</h2>
    <p>Что делает цикл while?</p>
    <button onclick="diagnosticAnswer(false)">Выполняется один раз</button>
    <button onclick="diagnosticAnswer(true)">Повторяется, пока условие истинно</button>
    <p id="diagnosticResult"></p>
  `;
}

function diagnosticAnswer(correct) {
  document.getElementById("diagnosticResult").textContent =
    correct ? "Верно! Можно переходить к практике." :
    "Повтори тему циклов и попробуй ещё раз.";
}

function exportCSV() {
  const rows = [["Модуль", "Работа", "Дата"]];
  Object.entries(progress).forEach(([key, item]) =>
    rows.push([key, item.work, item.date])
  );

  const csv = rows.map(row =>
    row.map(v => '"' + String(v).replaceAll('"', '""') + '"').join(";")
  ).join("\\r\\n");

  const link = document.createElement("a");
  link.href = URL.createObjectURL(
    new Blob(["\\ufeff" + csv], {type:"text/csv;charset=utf-8"})
  );
  link.download = "moia-traektoriya.csv";
  link.click();
}

</script>
</body>
</html>
